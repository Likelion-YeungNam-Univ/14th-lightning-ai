services:
  db:
    image: pgvector/pgvector:pg16
    container_name: assit-db
    environment:
      POSTGRES_USER: assit
      POSTGRES_PASSWORD: assit
      POSTGRES_DB: assit
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assit"]
      interval: 5s
      timeout: 3s
      retries: 10
